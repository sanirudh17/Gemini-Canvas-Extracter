<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Canvas Extractor — PDF &amp; Word Export</title>
  <meta name="description" content="Paste a Gemini share link. Get PDF, Word, or print.">

  <!-- Marked Markdown Parser (local vendor for instant offline-safe loading) -->
  <script src="/static/vendor/marked.min.js"></script>

  <!-- KaTeX for Scientific & Math Typesetting (local vendor + all 20 woff2 fonts) -->
  <link rel="stylesheet" href="/static/vendor/katex.min.css">
  <script src="/static/vendor/katex.min.js"></script>

  <!-- Unified Math & LaTeX Renderer -->
  <script src="/static/math_renderer.js"></script>

  <!-- Lucide Modern Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- App theme: set before paint to avoid flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('gemini_app_theme');
        var theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Design system -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="ascii-light-mode">

  <a href="#heroSection" class="skip-link">Skip to extractor</a>

  <!-- ============================== Top bar ============================== -->
  <header class="topbar no-print">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="ai-sparkle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.2 2.5C9.8 6.4 12.0 8.6 15.9 9.2C12.0 9.8 9.8 12.0 9.2 15.9C8.6 12.0 6.4 9.8 2.5 9.2C6.4 8.6 8.6 6.4 9.2 2.5Z"/>
            <path d="M17.3 13.1C17.7 15.6 19.0 16.9 21.5 17.3C19.0 17.7 17.7 19.0 17.3 21.5C16.9 19.0 15.6 17.7 13.1 17.3C15.6 16.9 16.9 15.6 17.3 13.1Z"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Gemini Canvas Extractor</span>
        </span>
      </div>

      <div class="topbar-controls">
        <!-- ASCII diagram theme (smooth sliding segmented pill) -->
        <div class="segmented" id="asciiSegmented" role="group" aria-label="ASCII diagram theme">
          <span class="segmented-thumb" id="asciiSegmentedThumb" aria-hidden="true"></span>
          <button
            id="asciiLightBtn"
            type="button"
            class="segmented-btn is-active"
            title="Light paper ASCII diagrams (dark text)"
            aria-pressed="true"
          >
            <i data-lucide="sun"></i>
            <span class="segmented-label">ASCII Light</span>
          </button>
          <button
            id="asciiDarkBtn"
            type="button"
            class="segmented-btn"
            title="Dark terminal ASCII diagrams (light text)"
            aria-pressed="false"
          >
            <i data-lucide="moon"></i>
            <span class="segmented-label">ASCII Dark</span>
          </button>
        </div>

        <!-- App light / dark theme (instant inline SVG swap, zero DOM rescan) -->
        <button
          id="themeToggleBtn"
          type="button"
          class="icon-btn"
          title="Toggle light / dark theme"
          aria-label="Toggle light / dark theme"
          aria-pressed="false"
        >
          <svg id="themeToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span class="icon-btn-label" id="themeToggleLabel">Dark</span>
        </button>

        <!-- Stop server: quiet icon action -->
        <button
          id="stopServerBtn"
          type="button"
          class="icon-btn icon-btn--square"
          title="Stop the local server process"
          aria-label="Stop the local server process"
        >
          <i data-lucide="power"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================== Main ============================== -->
  <main class="page">

    <noscript>
      <div class="alert no-print" role="alert">
        <div class="alert-body">This app needs JavaScript to extract and render Gemini canvases.</div>
      </div>
    </noscript>

    <!-- Hero / URL input -->
    <div class="workbench-center" id="workbenchCenter">
      <section id="heroSection" class="hero no-print" aria-labelledby="heroTitle">
        <h1 id="heroTitle" class="hero-title">Extract any Gemini Canvas.</h1>
        <p class="hero-sub">Share link to PDF, Word, or print — LaTeX math, tables, and ASCII diagrams intact.</p>
      </section>

      <div class="extract-card">
        <form id="extractForm" class="extract-form" autocomplete="off">
          <div class="extract-field">
            <i data-lucide="link" class="field-icon" aria-hidden="true"></i>
            <label for="urlInput" class="sr-only">Gemini share link</label>
            <input
              type="text"
              id="urlInput"
              placeholder="Paste Gemini share link…"
              class="extract-input"
              required
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              inputmode="url"
            >
            <button
              type="button"
              id="clearUrlBtn"
              class="clear-btn is-hidden"
              aria-label="Clear link"
            >
              <i data-lucide="x"></i>
            </button>
          </div>

          <button type="submit" id="extractBtn" class="btn-primary">
            <svg class="ai-sparkle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.2 2.5C9.8 6.4 12.0 8.6 15.9 9.2C12.0 9.8 9.8 12.0 9.2 15.9C8.6 12.0 6.4 9.8 2.5 9.2C6.4 8.6 8.6 6.4 9.2 2.5Z"/>
              <path d="M17.3 13.1C17.7 15.6 19.0 16.9 21.5 17.3C19.0 17.7 17.7 19.0 17.3 21.5C16.9 19.0 15.6 17.7 13.1 17.3C15.6 16.9 16.9 15.6 17.3 13.1Z"/>
            </svg>
            <span>Extract</span>
          </button>
        </form>

        <div class="extract-meta">
          <button
            id="openHistoryBtn"
            type="button"
            class="history-link"
            title="Open saved documents"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="historyDrawer"
          >
            <i data-lucide="history"></i>
            <span>History</span>
            <span id="historyBadge" class="count-badge" aria-label="0 saved documents">0</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Error alert -->
    <div id="errorAlert" class="no-print is-hidden" role="alert" tabindex="-1">
      <div class="alert">
        <i data-lucide="alert-circle" class="alert-icon" aria-hidden="true"></i>
        <div class="alert-body" id="errorMessage"></div>
        <button id="dismissErrorBtn" class="alert-close" aria-label="Dismiss error">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>

    <!-- Loading state -->
    <div id="loadingState" class="no-print is-hidden" aria-live="polite">
      <div class="loading-card">
        <div class="loading-spinner" aria-hidden="true">
          <span class="spinner-ring"></span>
          <svg class="ai-sparkle-icon spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.2 2.5C9.8 6.4 12.0 8.6 15.9 9.2C12.0 9.8 9.8 12.0 9.2 15.9C8.6 12.0 6.4 9.8 2.5 9.2C6.4 8.6 8.6 6.4 9.2 2.5Z"/>
            <path d="M17.3 13.1C17.7 15.6 19.0 16.9 21.5 17.3C19.0 17.7 17.7 19.0 17.3 21.5C16.9 19.0 15.6 17.7 13.1 17.3C15.6 16.9 16.9 15.6 17.3 13.1Z"/>
          </svg>
        </div>
        <p class="loading-title">Extracting…</p>
      </div>
    </div>

    <!-- ============================== Results ============================== -->
    <section id="resultsSection" class="results is-hidden" aria-live="polite">
      <div id="actionBar" class="actionbar no-print">
        <div class="actionbar-meta">
          <h2 id="docTitle" class="doc-title" tabindex="-1">Document title</h2>
          <div id="docSubtitle" class="doc-sub">0 words • 0 diagrams • 0 tables</div>
        </div>

        <div class="actionbar-actions">
          <button id="exportPdfBtn" type="button" class="btn-primary btn-sm" title="Download PDF">
            <i data-lucide="file-down"></i>
            <span>PDF</span>
          </button>

          <div class="btn-group" role="group" aria-label="More export options">
            <button id="exportDocxBtn" type="button" class="btn-secondary btn-sm" title="Download Word document (.docx)">
              <i data-lucide="file-text"></i>
              <span>Word</span>
            </button>

            <button id="printDocBtn" type="button" class="btn-ghost btn-sm" title="Print document or save as PDF">
              <i data-lucide="printer"></i>
              <span>Print</span>
            </button>

            <button
              id="copyMdBtn"
              type="button"
              class="btn-ghost btn-sm"
              title="Copy Markdown content to clipboard"
              aria-label="Copy Markdown content to clipboard"
            >
              <i data-lucide="copy"></i>
              <span>Copy</span>
            </button>
          </div>

          <button
            id="starDocBtn"
            type="button"
            class="btn-ghost btn-sm"
            title="Star this document"
            aria-label="Star this document"
            aria-pressed="false"
          >
            <i data-lucide="star" id="starDocIcon"></i>
            <span id="starDocLabel">Star</span>
          </button>

          <button
            id="noteDocBtn"
            type="button"
            class="btn-ghost btn-sm is-hidden"
            title="Add or edit note"
            aria-label="Add or edit note"
          >
            <i data-lucide="sticky-note"></i>
            <span id="noteDocLabel">Note</span>
          </button>
        </div>
      </div>

      <div class="document-card">
        <div class="print-document-header">
          <h1 id="printHeaderTitle">Gemini Canvas Artifact</h1>
          <div id="printHeaderMeta">Exported document</div>
        </div>

        <div id="renderedContainer" class="markdown-body"></div>
      </div>
    </section>

    <footer class="footer no-print">
      <span>PDF</span>
      <span class="footer-dot" aria-hidden="true">·</span>
      <span>DOCX</span>
      <span class="footer-dot" aria-hidden="true">·</span>
      <span>Print</span>
    </footer>
  </main>

  <!-- ============================== History drawer ============================== -->
  <div id="historyDrawerOverlay" class="drawer-overlay is-hidden" aria-hidden="true"></div>

  <aside id="historyDrawer" class="drawer" role="dialog" aria-modal="true" aria-label="Saved documents" aria-hidden="true" inert>
    <div class="drawer-head">
      <div class="drawer-title">
        <i data-lucide="history" aria-hidden="true"></i>
        <h2>History</h2>
      </div>
      <button id="closeHistoryBtn" class="icon-btn icon-btn--square" aria-label="Close history">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="drawer-toolbar">
      <div class="drawer-filter-bar" id="historyFilterBar" role="tablist" aria-label="Filter documents">
        <span class="drawer-filter-thumb" id="historyFilterThumb" aria-hidden="true"></span>
        <button
          id="historyFilterAllBtn"
          type="button"
          class="drawer-filter-btn is-active"
          role="tab"
          aria-selected="true"
        >
          <span>All</span>
          <span id="historyCountAll" class="count-badge">0</span>
        </button>
        <button
          id="historyFilterStarredBtn"
          type="button"
          class="drawer-filter-btn"
          role="tab"
          aria-selected="false"
        >
          <i data-lucide="star"></i>
          <span>Starred</span>
          <span id="historyCountStarred" class="count-badge">0</span>
        </button>
      </div>

      <div class="drawer-search">
        <i data-lucide="search" class="drawer-search-icon" aria-hidden="true"></i>
        <label for="historySearchInput" class="sr-only">Search documents</label>
        <input
          type="text"
          id="historySearchInput"
          placeholder="Search…"
          class="drawer-input"
          autocomplete="off"
          spellcheck="false"
        >
        <button
          type="button"
          id="clearHistorySearchBtn"
          class="drawer-search-clear is-hidden"
          aria-label="Clear search"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>

    <div id="historyItemsList" class="drawer-list"></div>

    <div class="drawer-foot">
      <span id="historyItemCountText" class="drawer-foot-count"></span>
      <button id="clearAllHistoryBtn" type="button" class="danger-link">Clear all</button>
    </div>
  </aside>

  <!-- Hidden iframe for exact PDF printing -->
  <iframe id="printIframe" title="Print preview" aria-hidden="true" tabindex="-1" style="position:fixed;top:0;left:0;width:0;height:0;border:0;visibility:hidden;pointer-events:none;"></iframe>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <div class="toast-inner">
      <i data-lucide="check" aria-hidden="true"></i>
      <span id="toastMsg">Done</span>
    </div>
  </div>

  <script src="/static/app.js?v=6.3"></script>
</body>
</html>
